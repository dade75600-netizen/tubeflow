name: TubeFlow Military Deep Ops Pipeline

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
  workflow_dispatch:

concurrency:
  group: military-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute video generation pipeline
        env:
          PYTHONUNBUFFERED: "1"
          YOUTUBE_TOKEN_MILITARY: ${{ secrets.YOUTUBE_TOKEN_MILITARY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_MILITARY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY_MILITARY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET_MILITARY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN_MILITARY }}
          TIKTOK_OPENID: ${{ secrets.TIKTOK_OPENID_MILITARY }}
        run: python -u pipeline.py --channel military --force-publish

      - name: Commit and push queue updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git restore config.yaml
          git add topics_queue.txt topics_queue_military.txt topics_queue_aviation.txt topics_done.txt video_history.txt music_history.txt
          git commit -m "Update military topics queue and history [skip ci]" || echo "No changes to commit"
          git push
