name: TubeFlow Cloud Scheduler
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '15 8 * * *'
    - cron: '15 13 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
jobs:
  military-pipeline:
    if: github.event.schedule == '0 8 * * *' || github.event.schedule == '0 13 * * *' || github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create secrets files
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_MILITARY_JSON }}' > token.json
      - name: Configure channel
        run: |
          sed -i 's/name: CivilAviationLords/name: Military/g' config.yaml
      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "YOUTUBE_SECRETS_FILE=client_secrets.json" >> .env
          echo "YOUTUBE_TOKEN_FILE=token.json" >> .env
          echo "TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}" >> .env
          echo "TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}" >> .env
          echo "TIKTOK_ACCESS_TOKEN=${{ secrets.TIKTOK_ACCESS_TOKEN }}" >> .env
          echo "TIKTOK_OPENID=${{ secrets.TIKTOK_OPENID }}" >> .env
      - name: Execute video generation pipeline
        run: |
          python -c "from backend.pipeline import Pipeline; res = Pipeline().run(); import sys; sys.exit(0 if res.get('success') else 1)"
      - name: Commit and push queue updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topics_queue_military.txt topics_done.txt video_history.txt music_history.txt
          git commit -m "Update military topics queue and history [skip ci]" || echo "No changes to commit"
          git push

  aviation-pipeline:
    if: github.event.schedule == '15 8 * * *' || github.event.schedule == '15 13 * * *' || github.event.schedule == '15 18 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create secrets files
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_AVIATION_JSON }}' > token.json
      - name: Configure channel
        run: |
          sed -i 's/name: CivilAviationLords/name: Aviation/g' config.yaml
      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "YOUTUBE_SECRETS_FILE=client_secrets.json" >> .env
          echo "YOUTUBE_TOKEN_FILE=token.json" >> .env
          echo "TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}" >> .env
          echo "TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}" >> .env
          echo "TIKTOK_ACCESS_TOKEN=${{ secrets.TIKTOK_ACCESS_TOKEN }}" >> .env
          echo "TIKTOK_OPENID=${{ secrets.TIKTOK_OPENID }}" >> .env
      - name: Execute video generation pipeline
        run: |
          python -c "from backend.pipeline import Pipeline; res = Pipeline().run(); import sys; sys.exit(0 if res.get('success') else 1)"
      - name: Commit and push queue updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topics_queue_aviation.txt topics_done.txt video_history.txt music_history.txt
          git commit -m "Update aviation topics queue and history [skip ci]" || echo "No changes to commit"
          git push
