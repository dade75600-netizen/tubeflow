name: TubeFlow Cloud Scheduler

on:
  schedule:
    - cron: '0 10 * * *'  # 12:00 Italy Time (Summer UTC+2)
    - cron: '0 16 * * *'  # 18:00 Italy Time (Summer UTC+2)
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to push queue updates back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create secrets files
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "YOUTUBE_SECRETS_FILE=client_secrets.json" >> .env
          echo "YOUTUBE_TOKEN_FILE=token.json" >> .env
          echo "TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}" >> .env
          echo "TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}" >> .env
          echo "TIKTOK_ACCESS_TOKEN=${{ secrets.TIKTOK_ACCESS_TOKEN }}" >> .env
          echo "TIKTOK_OPENID=${{ secrets.TIKTOK_OPENID }}" >> .env

      - name: Execute video generation pipeline
        run: |
          python -c "from backend.pipeline import Pipeline; Pipeline().run()"

      - name: Commit and push queue updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topics_queue.txt topics_done.txt video_history.txt music_history.txt
          git commit -m "Update topics queue and history [skip ci]" || echo "No changes to commit"
          git push
